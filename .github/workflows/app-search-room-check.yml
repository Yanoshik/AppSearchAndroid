name: App Search - Room Phase 3.1 Check (No APK)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-room:
    if: github.ref == 'refs/heads/develop/app-search-2.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile debug Kotlin including Room/KSP
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Run JVM unit tests (not Android instrumentation tests)
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Verify Room schema was exported
        shell: bash
        run: |
          if ! find app/schemas -type f -name '1.json' -print -quit | grep -q .; then
            echo '::error::Room schema 1.json was not generated'
            exit 1
          fi
          echo 'Room schema export exists.'
