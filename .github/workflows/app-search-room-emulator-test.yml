name: App Search - Room Phase 3.1 Emulator Tests (No Release APK)

# Trigger only when this workflow file changes on the approved development branch.
# No trigger for application source pushes and no release APK upload.
on:
  workflow_dispatch:
  push:
    branches:
      - develop/app-search-2.0
    paths:
      - .github/workflows/app-search-room-emulator-test.yml

permissions:
  contents: read

jobs:
  room-instrumentation-tests:
    if: github.ref == 'refs/heads/develop/app-search-2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout selected development branch
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure AndroidJUnitRunner for this CI job only
        shell: bash
        run: |
          # An ephemeral Gradle init script configures the test runner.
          # It does not edit or commit app/build.gradle.kts or application source.
          cat > "$RUNNER_TEMP/appsearch-room-tests.init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              project.plugins.withId("com.android.application") {
                  project.extensions.getByName("android").defaultConfig.testInstrumentationRunner =
                      "androidx.test.runner.AndroidJUnitRunner"
              }
          }
          GRADLE

      - name: Enable KVM access for emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-appsearch-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Room instrumented tests on temporary Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon --init-script "$RUNNER_TEMP/appsearch-room-tests.init.gradle" :app:connectedDebugAndroidTest

      - name: Upload test reports (not APKs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-phase-3-1-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7
